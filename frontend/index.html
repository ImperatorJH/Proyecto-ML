<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Asistencia</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
}

h1 {
    margin-top: 20px;
}

table {
    margin: auto;
    margin-top: 20px;
    border-collapse: collapse;
    width: 80%;
}

th, td {
    border: 1px solid #38bdf8;
    padding: 10px;
}

th {
    background: #0284c7;
}

tr:nth-child(even) {
    background: #1e293b;
}
</style>
</head>

<body>
<button onclick="iniciarReconocimiento()">🎥 Iniciar reconocimiento</button>
<button onclick="detenerReconocimiento()">🛑 Detener</button>
<button onclick="crearUsuario()">🔄 Crear Usuario</button>


<h1>📊 Registro de Asistencia</h1>

<table id="tabla">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Fecha</th>
            <th>Hora</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
async function crearUsuario() {
    const nombre = prompt("Ingrese el nombre del nuevo usuario:");
    if (!nombre) return alert("Nombre es requerido.");

    try {
        const res = await fetch("http://localhost:3000/api/usuarios/crear-usuario", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ nombre })
        });
        const data = await res.json();
        alert(data.mensaje);
    } catch (error) {
        console.error("Error creando usuario:", error);
        alert("Error al crear usuario.");
    }
}
async function cargarDatos() {
    try {
        const res = await fetch("http://localhost:3000/api/registro/registro");
        const data = await res.json();

        console.log("Respuesta backend:", data); // 🔍 debug

        const tabla = document.querySelector("#tabla tbody");
        tabla.innerHTML = "";

        // 🔥 Normalizar respuesta (array seguro)
        let lista = [];

        if (Array.isArray(data)) {
            lista = data;
        } else if (data.data) {
            lista = data.data;
        } else {
            lista = Object.values(data);
        }

        lista.forEach(registro => {
            const fila = `
                <tr>
                    <td>${registro.id ?? "-"}</td>
                    <td>${registro.nombre ?? "-"}</td>
                    <td>${registro.fecha ?? "-"}</td>
                    <td>${registro.hora ?? "-"}</td>
                </tr>
            `;
            tabla.innerHTML += fila;
        });

    } catch (error) {
        console.error("Error cargando datos:", error);
    }
}

// actualizar cada 3 segundos
setInterval(cargarDatos, 3000);

// carga inicial
cargarDatos();

function iniciarReconocimiento() {
    fetch("http://localhost:3000/api/reconocimiento/iniciar-reconocimiento")
        .then(res => res.json())
        .then(data => alert(data.mensaje));
}

function detenerReconocimiento() {
    fetch("http://localhost:3000/api/reconocimiento/detener-reconocimiento")
        .then(res => res.json())
        .then(data => alert(data.mensaje));
}
</script>

</body>
</html>
